name: SwiftRight

options:
  bundleIdPrefix: com.swiftright
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"
  minimumXcodeGenVersion: "2.38.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    DEVELOPMENT_TEAM: N92PMG7782
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ALWAYS_SEARCH_USER_PATHS: NO
    CLANG_ENABLE_MODULES: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEAD_CODE_STRIPPING: YES

targets:
  SwiftRight:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.swiftright.SwiftRight
        PRODUCT_NAME: SwiftRight
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/SwiftRight.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
    dependencies:
      - target: FinderExtension
        embed: true
        codeSign: true
      # App 侧要用 FIFinderSyncController.isExtensionEnabled 判断扩展开没开。
      - sdk: FinderSync.framework
      - sdk: UserNotifications.framework

  FinderExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: FinderExtension
        excludes:
          - ".placeholder"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.swiftright.SwiftRight.FinderExtension
        PRODUCT_NAME: FinderExtension
        INFOPLIST_FILE: FinderExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: FinderExtension/FinderExtension.entitlements
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @executable_path/../../../../Frameworks"
    dependencies:
      - sdk: FinderSync.framework

schemes:
  SwiftRight:
    build:
      targets:
        SwiftRight: all
    run:
      config: Debug
    archive:
      config: Release
